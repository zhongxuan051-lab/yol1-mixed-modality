# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLO11 mixed-modality P2/P3/P4/P5 experiment. For Usage examples see https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 1
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO11n backbone  一般P3适用于检测小目标，P4适用于检测小目标，P5适用于检测小目标
backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]

# YOLO11n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]

  # Add one P2 branch from P3; retain baseline layers 0-22.
  - [16, 1, nn.Upsample, [None, 2, "nearest"]] # 23: P3 -> P2
  - [[-1, 2], 1, Concat, [1]] # 24: fuse with backbone P2
  - [-1, 2, C3k2, [256, False]] # 25: P2 output, same width as baseline P3
  - [[25, 16, 19, 22], 1, Detect, [nc]] # 26: P2/P3/P4/P5
